apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: devops-assignment
  region: ap-south-1
managedNodeGroups:
  - name: managed-ng
    instanceType: t3.medium
    minSize: 2
    desiredCapacity: 2
    maxSize: 3
    volumeSize: 30
    iam:
      withAddonPolicies:
        autoScaler: true
        cloudWatch: true
        ebs: true
