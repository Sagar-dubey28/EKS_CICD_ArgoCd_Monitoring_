grafana:
  enabled: true
  adminUser: admin
  adminPassword: CHANGE_ME_BEFORE_PRODUCTION
  service:
    type: LoadBalancer
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
alertmanager:
  enabled: true
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
