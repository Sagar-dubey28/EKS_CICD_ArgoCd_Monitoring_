apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-devops-demo
  namespace: devops-demo
  labels:
    app: eks-devops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eks-devops-demo
  template:
    metadata:
      labels:
        app: eks-devops-demo
    spec:
      containers:
        - name: app
          image: REPLACE_WITH_ECR_IMAGE
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_VERSION
              value: "git-managed"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
